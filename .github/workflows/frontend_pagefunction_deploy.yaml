name: Deploy Frontend with page function

on:
  push:
    branches:
      - 92easy-prod
    tags:
      - "*"
    paths:
      - "frontend/**"
      - "pages/**"
      - ".github/workflows/frontend_pagefunction_deploy.yaml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Deploy Frontend for ${{ github.ref_name }}
        run: |
          cd frontend/
          pnpm install --no-frozen-lockfile
          pnpm build:pages
          cd ../pages/
          if [ -n "${{ secrets.PAGE_TOML }}" ]; then
            printf '%s\n' '${{ secrets.PAGE_TOML }}' > wrangler.toml
          fi
          pnpm install --no-frozen-lockfile
          if [ -n "${{ secrets.FRONTEND_NAME }}" ]; then
            pnpm exec wrangler pages deploy ../frontend/dist --project-name="${{ secrets.FRONTEND_NAME }}" --branch production
          else
            pnpm exec wrangler pages deploy ../frontend/dist --branch production
          fi
          echo "Deploying production for ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
